name: Far Cry VR Automated Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build Far Cry VR
    runs-on: windows-2022

    permissions: write-all

    env:
      PYTHONUTF8: 1

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Python (for meson)
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install meson
        run: pip install meson ninja

      # dxvk needs just the GLSL compiler out of the Vulkan SDK (its Vulkan and SPIR-V headers are submodules),
      # and LunarG removes old SDK installers from its servers (1.3.290.0 is gone), so take glslang straight
      # from the Khronos release on GitHub instead of installing a whole SDK
      - name: Install glslang
        shell: pwsh
        run: |
          $version = "16.6.0"
          $zip = "$env:RUNNER_TEMP\glslang.zip"
          Invoke-WebRequest -Uri "https://github.com/KhronosGroup/glslang/releases/download/$version/glslang-$version-windows-x86_64-release.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\glslang" -Force
          "$env:RUNNER_TEMP\glslang\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$env:RUNNER_TEMP\glslang\bin\glslang.exe" --version

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x86

      - name: Prepare MSVC devenv
        uses: bus1/cabuild/action/msdevshell@v1
        with:
          architecture: x86

      # the mod's dxvk changes that are not in fholger/dxvkry yet (see Sources/ThirdParty/dxvk-patches)
      - name: Patch dxvk
        working-directory: "Sources/ThirdParty/dxvk"
        shell: bash
        run: git apply --verbose ../dxvk-patches/*.patch

      - name: Prepare dxvk build
        working-directory: "Sources/ThirdParty/dxvk"
        shell: cmd
        run: dxvkry_setup.bat

      - name: Build dxvk
        working-directory: "Sources/ThirdParty/dxvk/build"
        run: |
          msbuild dxvk.sln -m
          meson install

      - name: Build CryGame
        working-directory: "Sources/CryGame C++/Solution1"
        run: msbuild Solution1.sln /p:Configuration=Release -m

      # FarCryVR.exe is built from source so the environment it hands to dxvk always matches
      # Sources/Launcher/src/main.rs (the FarCryVR.exe checked in at the repository root is a stale fallback)
      - name: Setup Rust (for the launcher)
        uses: dtolnay/rust-toolchain@stable

      - name: Build launcher
        working-directory: "Sources/Launcher"
        run: cargo build --release

      - name: Create installer
        working-directory: installer
        shell: cmd
        run: create_installer.bat

      - name: Move 'latest' tag to this commit
        if: github.ref_type == 'branch'
        shell: bash
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Update Github dev release
        if: github.ref_type == 'branch'
        uses: softprops/action-gh-release@v3
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          tag_name: latest
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          name: "FarCry VR development build"
          files: |
            installer/farcry-vrmod*.exe

      - name: Create tagged Github release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false
          name: "FarCry VR release ${{ github.ref_name }}"
          files: |
            installer/farcry-vrmod*.exe
